name: Regiao Norte 2026-10-23 publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regiao-norte-20261023.yml'
      - 'regiao-norte/4a-2026-10-23/report.md'
      - 'regiao-norte/4a-2026-10-23/build.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: norte4-publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install publication tools
        run: python -m pip install requests beautifulsoup4 pymupdf reportlab pillow markdown2 playwright
      - name: Locate previously verified sources
        id: cache
        run: |
          mkdir -p /tmp/norte4/fontes
          ready=true
          for source in inpe cemaden sgb censipam ons; do
            if ! test -s "regiao-norte/4a-2026-10-23/fontes/$source.pdf"; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if $ready; then cp regiao-norte/4a-2026-10-23/fontes/*.pdf /tmp/norte4/fontes/; fi
      - name: Reuse verified source artifact from this session
        if: steps.cache.outputs.ready != 'true'
        uses: actions/download-artifact@v4
        with:
          name: norte4-publicacao
          run-id: 40015674912
          github-token: ${{ github.token }}
          path: /tmp/norte4
      - name: Generate and validate full document
        run: |
          cp regiao-norte/4a-2026-10-23/report.md /tmp/norte4/report.md
          cp regiao-norte/4a-2026-10-23/build.py /tmp/norte4/builder_reference.py
          python regiao-norte/4a-2026-10-23/build.py --output /tmp/norte4
      - name: Check website and actual downloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import threading,shutil,hashlib
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          root=Path('/tmp/norte4')
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  chrome=shutil.which('google-chrome') or shutil.which('chromium')
                  browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000},accept_downloads=True)
                  page.goto(f'http://127.0.0.1:{server.server_port}/index.html',wait_until='networkidle')
                  page.wait_for_function("Array.from(document.querySelectorAll('figure img')).every(i=>i.complete&&i.naturalWidth>0)")
                  assert page.locator('figure img').count()==38
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  assert '4 de dezembro de 2026' in page.locator('header').inner_text()
                  page.locator('header').screenshot(path=str(root/'qa/web-abertura.png'))
                  for href in ['documentos/NT_Regiao_Norte_4a_23-10-2026.pdf','indicadores.csv']:
                      with page.expect_download() as event:page.locator('.actions a[href="'+href+'"]').click()
                      assert hashlib.sha256(Path(event.value.path()).read_bytes()).digest()==hashlib.sha256((root/href).read_bytes()).digest()
                  page.locator('[data-zoom]').first.click();assert page.locator('dialog').evaluate('(d)=>d.open');page.keyboard.press('Escape')
                  page.locator('.actions a[href="#resumo"]').click();assert page.evaluate('location.hash')=='#resumo'
                  page.set_viewport_size({'width':390,'height':844})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  page.locator('header').screenshot(path=str(root/'qa/web-celular.png'))
                  browser.close()
          finally:server.shutdown();server.server_close()
          print('WEB QA: 38 images, zoom, navigation, PDF/CSV downloads, desktop and mobile passed.')
          PY
      - name: Save complete publication and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norte4-publicacao
          path: /tmp/norte4/
          if-no-files-found: error
          retention-days: 7
