name: GAOPS 116 - integrate ONS and cross-analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaops116-include-ons.yml'
      - 'gaops/116a-2026-11-10/include_ons.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaops116-received
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gaops/116a-2026-11-10
      - run: python -m pip install 'pymupdf==1.26.7' reportlab beautifulsoup4 requests playwright
      - name: Integrate three received presentations with unchanged source bytes
        run: |
          python -m py_compile gaops/116a-2026-11-10/include_ons.py
          python gaops/116a-2026-11-10/include_ons.py --out /tmp/gaops116-v03
      - name: Verify page, images, downloads, metadata and anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import threading,shutil,hashlib,json,csv
          from playwright.sync_api import sync_playwright
          root=Path('/tmp/gaops116-v03')
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  chrome=shutil.which('google-chrome') or shutil.which('chromium')
                  assert chrome,'Browser unavailable'
                  browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000},accept_downloads=True)
                  url=f'http://127.0.0.1:{server.server_port}/index.html'
                  page.goto(url,wait_until='networkidle')
                  assert page.locator('figure').count()==35
                  assert page.locator('#ons figure').count()==11
                  assert page.locator('#ons h3').count()==6
                  assert page.locator('h1').inner_text()=='116ª Reunião do GAOPS'
                  assert page.locator('main > section').last.get_attribute('id')=='anexo-i'
                  assert '204%' in page.locator('#executivo').inner_text()
                  assert 'ainda não foi recebida' not in page.locator('#executivo').inner_text()
                  assert '54,0%' in page.locator('#ons').inner_text()
                  page.locator('header').screenshot(path=str(root/'qa/header-desktop.png'))
                  for href in ['documentos/NT_GAOPS_116_10-11-2026_PREVIA.pdf','indicadores.csv']:
                      with page.expect_download() as event:page.locator('header a[href="'+href+'"]').click()
                      assert hashlib.sha256(Path(event.value.path()).read_bytes()).hexdigest()==hashlib.sha256((root/href).read_bytes()).hexdigest()
                  page.locator('header a[href="#anexo-i"]').click();page.wait_for_timeout(300)
                  y=page.locator('#anexo-i').bounding_box()['y'];assert 0<=y<180,('Anchor misplaced',y)
                  page.locator('#anexo-i').screenshot(path=str(root/'qa/annex-web.png'))
                  with page.expect_download() as event:page.locator('#anexo-i a[download]').click()
                  assert Path(event.value.path()).stat().st_size>1000
                  for image in page.locator('figure img').all():image.evaluate('(e)=>e.loading="eager"')
                  page.wait_for_function("[...document.querySelectorAll('figure img')].every(e=>e.complete&&e.naturalWidth>0)")
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  page.set_viewport_size({'width':390,'height':844});page.goto(url+'#anexo-i',wait_until='networkidle')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  assert 0<=page.locator('#anexo-i').bounding_box()['y']<180
                  page.goto(url,wait_until='networkidle');page.locator('header').screenshot(path=str(root/'qa/header-mobile.png'))
                  browser.close()
          finally:server.shutdown();server.server_close()
          with (root/'indicadores.csv').open(encoding='utf-8-sig') as f:assert len(list(csv.DictReader(f,delimiter=';')))==68
          m=json.loads((root/'manifesto.json').read_text());assert m['version']=='0.3' and m['figure_count']==35
          assert m['sources']['ons']['sha256']=='7bef207e667eb08c522fe046e2ac9fbdaa618e7b3d1b00c803a82c310b1d9e29'
          m['browser_checks']={'desktop':True,'mobile':True,'downloads':True,'annex_anchor':True,'all_images_loaded':True}
          (root/'manifesto.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BROWSER AND DATA CHECKS PASSED')
          PY
      - name: Preserve generated files and visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaops116-ons-v03-validated
          path: /tmp/gaops116-v03/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish only validated meeting files
        run: |
          set -euo pipefail
          target='gaops/116a-2026-11-10'
          cp /tmp/gaops116-v03/index.html "$target/index.html"
          cp /tmp/gaops116-v03/indicadores.csv "$target/indicadores.csv"
          cp /tmp/gaops116-v03/manifesto.json "$target/manifesto.json"
          cp /tmp/gaops116-v03/assets/*.jpg "$target/assets/"
          cp /tmp/gaops116-v03/fontes/*.pdf "$target/fontes/"
          cp /tmp/gaops116-v03/documentos/*.pdf "$target/documentos/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target/index.html" "$target/indicadores.csv" "$target/manifesto.json" "$target/assets" "$target/fontes" "$target/documentos"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '116ª GAOPS prévia 0.3: três verticais, cruzamentos ONS, 35 figuras, NT PDF e Anexo I'
          git pull --rebase origin main
          git push origin HEAD:main
