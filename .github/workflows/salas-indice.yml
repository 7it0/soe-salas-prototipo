name: Salas SOE - indice por bacia
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/salas-indice.yml'
      - 'tools/build_salas_index.py'
      - 'tools/refresh_salas_index.py'
      - '**/manifesto.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: salas-indice
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install parser and browser checks
        run: python -m pip install beautifulsoup4 playwright
      - name: Synchronize manifest-backed meetings and verify all destinations
        run: python tools/refresh_salas_index.py
      - name: Test GAOPS final links, search and mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import threading,shutil,json
          from playwright.sync_api import sync_playwright
          root=Path.cwd();qa=Path('/tmp/salas-indice-qa');qa.mkdir()
          manifest=json.loads((root/'salas/reunioes.json').read_text(encoding='utf-8'))
          records=manifest['records'];total=len(records)
          north=sum(x['slug']=='regiao-norte' for x in records)
          date_matches=sum(x['date']=='2026-10-29' for x in records)
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  chrome=shutil.which('google-chrome') or shutil.which('chromium')
                  if not chrome:raise RuntimeError('Browser unavailable; index not published without layout test')
                  browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  base=f'http://127.0.0.1:{server.server_port}'
                  page.goto(base+'/salas/#paraiba-do-sul',wait_until='networkidle')
                  assert page.locator('.meeting').count()==total
                  assert page.locator('.basin').count()==manifest['basins']
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  cards=page.locator('#paraiba-do-sul .meeting')
                  assert cards.count()>=2
                  assert '116ª' in cards.nth(0).inner_text()
                  assert '115ª' in cards.nth(1).inner_text()
                  assert 'NT final da reunião' in cards.nth(0).inner_text()
                  pdf=cards.nth(0).locator('a.pdf').get_attribute('href')
                  assert pdf.endswith('NT_GAOPS_116_10-11-2026_FINAL.pdf'),pdf
                  doc=(root/'salas'/pdf).resolve()
                  with doc.open('rb') as f:assert f.read(5)==b'%PDF-'
                  assert 'gaops/116a-2026-11-10/index.html' in cards.nth(0).locator('a.read').get_attribute('href')
                  page.locator('#paraiba-do-sul').screenshot(path=str(qa/'indice-paraiba-do-sul.png'))
                  page.screenshot(path=str(qa/'indice-computador.png'),full_page=True)
                  page.locator('#busca').fill('116ª')
                  assert page.locator('.meeting:visible').count()==1
                  page.locator('#busca').fill('Norte')
                  assert page.locator('.meeting:visible').count()==north
                  page.locator('#busca').fill('29/10/2026')
                  assert page.locator('.meeting:visible').count()==date_matches
                  page.locator('#limpar').click()
                  assert page.locator('.meeting:visible').count()==total
                  page.set_viewport_size({'width':390,'height':844})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  page.goto(base+'/salas/#paraiba-do-sul',wait_until='networkidle')
                  page.screenshot(path=str(qa/'indice-celular.png'),full_page=True)
                  browser.close()
          finally:server.shutdown();server.server_close()
          checks={'meetings':total,'basins':manifest['basins'],'gaops116_first':True,
                  'gaops115_preserved':True,'final_pdf_exists':True,'search':True,
                  'desktop_mobile':True,'local_destinations_verified':True}
          (qa/'checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TESTES OK',json.dumps(checks,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salas-indice-validado
          path: |
            salas/
            /tmp/salas-indice-qa/
          retention-days: 7
      - name: Publish only the validated catalog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add salas/index.html salas/reunioes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sincroniza índice por bacia: GAOPS 116 final, PDFs e demais reuniões com manifesto'
          git pull --rebase origin main
          git push origin HEAD:main
