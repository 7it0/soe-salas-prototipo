name: Paranapanema 2026-10-22 sources and publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paranapanema-20261022.yml'
      - 'paranapanema/10a-2026-10-22/content.json'
      - 'paranapanema/10a-2026-10-22/build.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paranapanema-20261022-build
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python -m pip install 'pymupdf==1.26.7' requests beautifulsoup4 playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Build and validate integral publication
        run: python paranapanema/10a-2026-10-22/build.py --output /tmp/paranapanema-publicacao --qa /tmp/paranapanema-qa
      - name: Preserve publication and visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paranapanema-publicacao-20261022
          path: |
            /tmp/paranapanema-publicacao/
            /tmp/paranapanema-qa/
            paranapanema/10a-2026-10-22/build.py
          if-no-files-found: error
          retention-days: 7
