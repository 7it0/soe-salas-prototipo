name: Paranapanema 2026-10-22 sources and publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paranapanema-20261022.yml'
      - 'paranapanema/10a-2026-10-22/content.json'
      - 'paranapanema/10a-2026-10-22/build.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python -m pip install 'pymupdf==1.26.7' requests
      - name: Retrieve official presentations and prepare inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, fitz, json, hashlib
          root=Path('/tmp/paranapanema-fontes');root.mkdir(exist_ok=True)
          base='https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/apresentacoes-das-reunioes/'
          names={'cemaden':'apres-cemaden-paranapanema-221026.pdf','ons':'apresentacao-ons_bacia-do-rio-paranapanema-20261022.pdf'}
          meta={}
          for key,name in names.items():
              view=base+name+'/view'
              r=requests.get(view,timeout=90);r.raise_for_status()
              (root/(key+'_view.html')).write_text(r.text,encoding='utf-8')
              url=base+name+'/@@download/file'
              r=requests.get(url,timeout=90);r.raise_for_status();assert r.content.startswith(b'%PDF')
              (root/(key+'.pdf')).write_bytes(r.content)
              doc=fitz.open(stream=r.content,filetype='pdf')
              (root/(key+'.txt')).write_text('\n\n'.join('PAGINA '+str(i+1)+'\n'+p.get_text() for i,p in enumerate(doc)),encoding='utf-8')
              folder=root/key;folder.mkdir(exist_ok=True)
              for i,p in enumerate(doc):
                  p.get_pixmap(matrix=fitz.Matrix(1600/p.rect.width,1600/p.rect.width),alpha=False).save(folder/f'p{i+1:02d}.png')
              meta[key]={'view':view,'download':url,'pages':len(doc),'sha256':hashlib.sha256(r.content).hexdigest()}
              print(key,meta[key],flush=True)
          (root/'sources.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paranapanema-fontes-20261022
          path: /tmp/paranapanema-fontes/
          retention-days: 7
