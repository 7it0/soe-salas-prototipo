name: Publish Pantanal 13th meeting full web edition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pantanal-20261021.yml'
      - 'pantanal/13a-2026-10-21/publicacao.json'
      - 'pantanal/13a-2026-10-21/build_publication.py'
      - 'pantanal/13a-2026-10-21/publish.py'
      - 'pantanal/13a-2026-10-21/standardize_buttons.py'
      - 'pantanal/13a-2026-10-21/indicadores.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pantanal-20261021-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      - name: Install publication tools
        run: |
          python -m pip install --disable-pip-version-check pymupdf requests beautifulsoup4 playwright
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Build and validate complete publication
        run: python pantanal/13a-2026-10-21/publish.py --output /tmp/pantanal-publication
      - name: Apply GAOPS button standard and test downloads
        run: python pantanal/13a-2026-10-21/standardize_buttons.py --output /tmp/pantanal-publication
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantanal-20261021-publication-qa
          path: |
            /tmp/pantanal-publication-qa/
            /tmp/pantanal-publication/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only validated meeting files
        run: |
          set -euo pipefail
          target='pantanal/13a-2026-10-21'
          test -s /tmp/pantanal-publication/index.html
          test -s /tmp/pantanal-publication/manifesto.json
          test -s /tmp/pantanal-publication/indicadores.csv
          test -s /tmp/pantanal-publication/documentos/NT_Pantanal_13a_21102026_WEB.pdf
          cp -a /tmp/pantanal-publication/. "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target/index.html" "$target/assets" "$target/fontes" "$target/documentos" "$target/manifesto.json" "$target/indicadores.csv"
          if git diff --cached --quiet; then
            echo 'Publication already up to date'
            exit 0
          fi
          git commit -m 'Preserva NT Pantanal integral e aplica botões padronizados PDF, HTML e CSV'
          git pull --rebase origin main
          git push origin HEAD:main
