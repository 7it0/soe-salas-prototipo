name: GAOPS 116 - ONS and meeting register
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaops116-ons.yml'
      - 'gaops/116a-2026-11-10/update_ons.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaops116-received
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gaops/116a-2026-11-10
      - name: Install publication tools
        run: python -m pip install 'pymupdf==1.26.7' reportlab beautifulsoup4 requests playwright
      - name: Incorporate exact received ONS and update all documentary statuses
        run: |
          python -m py_compile gaops/116a-2026-11-10/update_ons.py
          python gaops/116a-2026-11-10/update_ons.py --out /tmp/gaops116-ons
      - name: Verify page, downloads, images and meeting register
        run: |
          python - <<'PY'
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import threading,shutil,hashlib,json
          from playwright.sync_api import sync_playwright
          root=Path('/tmp/gaops116-ons')
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  chrome=shutil.which('google-chrome') or shutil.which('chromium')
                  assert chrome,'Browser unavailable'
                  browser=p.chromium.launch(executable_path=chrome,headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000},accept_downloads=True)
                  url=f'http://127.0.0.1:{server.server_port}/index.html'
                  page.goto(url,wait_until='networkidle')
                  assert page.locator('figure').count()==35
                  assert page.locator('#ons figure').count()==11
                  assert page.locator('h1').inner_text()=='116ª Reunião do GAOPS'
                  assert page.locator('main > section').last.get_attribute('id')=='anexo-i'
                  assert '0.3' in page.locator('#publication-status').inner_text()
                  assert 'incorporada nesta revisão' in page.locator('#registro').inner_text()
                  assert page.locator('nav a[href="#ons"]').inner_text()=='ONS'
                  text=page.locator('body').inner_text().lower()
                  for term in ['ons aguardado','ons pendente','ons ainda não recebido','ons · pendente']:
                      assert term not in text,term
                  page.locator('header').screenshot(path=str(root/'qa/header-desktop.png'))
                  page.locator('#registro').screenshot(path=str(root/'qa/registro.png'))
                  for selector in ['#pdf-action','#csv-action','#anexo-i a[download]']:
                      with page.expect_download() as event:page.locator(selector).click()
                      actual=Path(event.value.path()).read_bytes()
                      href=page.locator(selector).get_attribute('href')
                      assert hashlib.sha256(actual).hexdigest()==hashlib.sha256((root/href).read_bytes()).hexdigest()
                  source=page.request.get(url.replace('index.html','fontes/ons.pdf'))
                  assert source.ok
                  assert hashlib.sha256(source.body()).hexdigest()=='7bef207e667eb08c522fe046e2ac9fbdaa618e7b3d1b00c803a82c310b1d9e29'
                  for image in page.locator('figure img').all():image.evaluate('(e)=>e.loading="eager"')
                  page.wait_for_function("[...document.querySelectorAll('figure img')].every(e=>e.complete&&e.naturalWidth>0)")
                  page.goto(url+'#anexo-i',wait_until='networkidle');page.wait_for_timeout(300)
                  y=page.locator('#anexo-i').bounding_box()['y'];assert 0<=y<180,y
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  page.set_viewport_size({'width':390,'height':844});page.goto(url,wait_until='networkidle')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2')
                  page.locator('header').screenshot(path=str(root/'qa/header-mobile.png'))
                  page.goto(url+'#anexo-i',wait_until='networkidle');page.wait_for_timeout(300)
                  y=page.locator('#anexo-i').bounding_box()['y'];assert 0<=y<180,y
                  browser.close()
          finally:server.shutdown();server.server_close()
          m=json.loads((root/'manifesto.json').read_text())
          m['browser_checks']={'desktop':True,'mobile':True,'downloads':True,'annex_anchor':True,'all_images_loaded':True,'ons_status_updated':True,'meeting_register_updated':True,'ons_source_identical':True}
          (root/'manifesto.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BROWSER CHECKS PASSED: 35 figures, 64 indicators, register and ONS status, PDFs and original source')
          PY
      - name: Preserve deliverables and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaops116-ons-validated
          path: /tmp/gaops116-ons/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish only validated meeting files
        run: |
          set -euo pipefail
          target='gaops/116a-2026-11-10'
          mkdir -p "$target/assets" "$target/fontes" "$target/documentos"
          cp /tmp/gaops116-ons/index.html "$target/index.html"
          cp /tmp/gaops116-ons/indicadores.csv "$target/indicadores.csv"
          cp /tmp/gaops116-ons/manifesto.json "$target/manifesto.json"
          cp /tmp/gaops116-ons/assets/*.jpg "$target/assets/"
          cp /tmp/gaops116-ons/fontes/*.pdf "$target/fontes/"
          cp /tmp/gaops116-ons/documentos/*.pdf "$target/documentos/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target/index.html" "$target/indicadores.csv" "$target/manifesto.json" "$target/assets" "$target/fontes" "$target/documentos"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '116ª GAOPS revisão 0.3: ONS incorporado, três verticais, 35 figuras, 64 indicadores e registro atualizado'
          git pull --rebase origin main
          git push origin HEAD:main
